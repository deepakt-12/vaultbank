version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: vaultbank-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7.0
    container_name: vaultbank-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval '
        try {
          rs.status();
          console.log("Replica set already initialized");
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongo:27017" }]
          });
          console.log("Replica set initiated successfully");
        }
      '

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: vaultbank-server
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongo:27017/vaultbank?replicaSet=rs0
      - SESSION_SECRET=docker-production-session-secret-must-be-min-64-random-chars-1234567890
      - SESSION_NAME=vaultbank.sid
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - CSRF_SECRET=docker-production-csrf-secret-1234567890abcdef
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: vaultbank-client
    restart: on-failure
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:

